name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs full history to compute the version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Umbraco.Community.WorktreeDevPort.slnx

      - run: dotnet build Umbraco.Community.WorktreeDevPort.slnx -c Release --no-restore

      - run: >
          dotnet pack src/Umbraco.Community.WorktreeDevPort/Umbraco.Community.WorktreeDevPort.csproj
          -c Release --no-build -o ./artifacts

      # Exchanges this workflow's OIDC token for a short-lived (1 hour) NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org for this repo + workflow file.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name, not your email

      - run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) and provenance
    defaults:
      run:
        working-directory: packages/worktree-dev-port
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      # No token needed: authenticates via OIDC once a Trusted Publisher is configured
      # on npmjs.com for this repo + workflow file.
      - run: npm publish --access public
